when:
  - event: [push, pull_request]

steps:
  test:
    image: python:3.13-slim
    commands:
      - pip install --no-cache-dir -r requirements.txt pytest
      - python -m pytest tests/ -q

  lint:
    image: python:3.13-slim
    commands:
      - pip install --no-cache-dir ruff
      - ruff check --select E9,F scripts tests
